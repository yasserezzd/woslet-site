<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Confirm Your Woslet Email</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site">
    <div class="inner">
      <a class="brand" href="./"><img src="icon.png" alt="">Woslet</a>
      <h1>Confirm your email</h1>
      <p>تأكيد البريد الإلكتروني</p>
    </div>
  </header>
  <main>
    <section class="card">
      <p id="status" class="status">Confirming… · جارٍ التأكيد…</p>
      <p class="muted">Go back to the Woslet app and sign in with your email and password.<br>
        ارجع إلى تطبيق وصلت وسجّل الدخول ببريدك وكلمة المرور.</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script>
    // The sign-up email links here with a one-time token that confirms the address.
    const client = supabase.createClient(
      "https://ofczwoccuhzrwqhoblqu.supabase.co",
      "sb_publishable_u0erLQbuooHpQDW-SArScg_CzIm9tC6",
      { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } }
    );
    const status = document.getElementById("status");

    function done(ok) {
      status.textContent = ok
        ? "Your email is confirmed! · تم تأكيد بريدك الإلكتروني!"
        : "This link has expired or was already used. Try signing in; if that fails, sign up again. · انتهت صلاحية الرابط أو استُخدم من قبل. جرّب تسجيل الدخول، وإن لم ينجح سجّل من جديد.";
      status.className = "status " + (ok ? "ok" : "err");
    }

    // Supabase confirms the address before sending people here, then adds
    // tokens or a code (nothing more to do) or an error; a custom email
    // template sends a token_hash to verify here instead.
    async function confirmEmail() {
      const query = new URLSearchParams(location.search);
      const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
      history.replaceState(null, "", location.pathname);
      if (hash.get("error") || query.get("error")) return done(false);
      if (hash.get("access_token") || query.get("code")) return done(true);
      const tokenHash = query.get("token_hash");
      if (!tokenHash) return done(false);
      const { error } = await client.auth.verifyOtp({ token_hash: tokenHash, type: query.get("type") || "email" });
      if (error) return done(false);
      await client.auth.signOut();
      done(true);
    }

    confirmEmail();
  </script>
</body>
</html>
