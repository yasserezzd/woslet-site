<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Reset Your Woslet Password</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site">
    <div class="inner">
      <a class="brand" href="./"><img src="icon.png" alt="">Woslet</a>
      <h1>Choose a new password</h1>
      <p>اختر كلمة مرور جديدة</p>
    </div>
  </header>
  <main>
    <section class="card">
      <p id="status" class="status">Checking your link… · جارٍ التحقق من الرابط…</p>
      <form id="form" hidden>
        <label for="password">New password · كلمة المرور الجديدة</label>
        <input id="password" type="password" minlength="6" autocomplete="new-password" required>
        <label for="confirm">Confirm password · تأكيد كلمة المرور</label>
        <input id="confirm" type="password" minlength="6" autocomplete="new-password" required>
        <button id="save" type="submit">Save password · حفظ كلمة المرور</button>
      </form>
      <p class="muted">Then go back to the Woslet app and sign in with your email and the new password.<br>
        بعدها ارجع إلى تطبيق وصلت وسجّل الدخول ببريدك وكلمة المرور الجديدة.</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script>
    // The reset email links here with a one-time token. It is exchanged for a
    // short session, which may only change this account's password.
    const client = supabase.createClient(
      "https://ofczwoccuhzrwqhoblqu.supabase.co",
      "sb_publishable_u0erLQbuooHpQDW-SArScg_CzIm9tC6",
      { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } }
    );
    const status = document.getElementById("status");
    const form = document.getElementById("form");
    const save = document.getElementById("save");

    function show(text, kind) {
      status.textContent = text;
      status.className = "status " + (kind || "");
    }

    async function start() {
      const params = new URLSearchParams(location.search);
      const tokenHash = params.get("token_hash");
      if (!tokenHash) {
        show("This link is incomplete. Request a new one from the app (Forgot Password?). · الرابط غير مكتمل. اطلب رابطًا جديدًا من التطبيق.", "err");
        return;
      }
      const { error } = await client.auth.verifyOtp({ token_hash: tokenHash, type: "recovery" });
      if (error) {
        show("This link has expired or was already used. Request a new one from the app. · انتهت صلاحية الرابط أو استُخدم من قبل. اطلب رابطًا جديدًا من التطبيق.", "err");
        return;
      }
      show("Enter your new password. · أدخل كلمة المرور الجديدة.");
      form.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      if (password.length < 6) {
        show("Use at least 6 characters. · استخدم 6 أحرف على الأقل.", "err");
        return;
      }
      if (password !== confirm) {
        show("The passwords don't match. · كلمتا المرور غير متطابقتين.", "err");
        return;
      }
      save.disabled = true;
      const { error } = await client.auth.updateUser({ password });
      if (error) {
        save.disabled = false;
        show("Couldn't save the password: " + error.message, "err");
        return;
      }
      await client.auth.signOut();
      form.hidden = true;
      show("Your password was changed. Sign in to the app with it now. · تم تغيير كلمة المرور. سجّل الدخول إلى التطبيق بها الآن.", "ok");
    });

    start();
  </script>
</body>
</html>
